<!DOCTYPE html>
<html lang="it" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Migrazione dati · Study Hub</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <header class="header">
            <h1 class="logo"><span class="brand-mark" aria-hidden="true"></span>Study Hub</h1>
            <a class="back-button" href="index.html">← Corsi</a>
        </header>
        <main class="migration">
            <h2>Migrazione dati</h2>
            <p>Carica le domande di <code>data.js</code> nel database Supabase.</p>
            <p><strong>Controlla che le tabelle siano vuote</strong> per evitare duplicati.</p>
            <button id="startBtn" class="btn btn-primary">Avvia migrazione</button>
            <div id="log" class="migration-log" role="log" aria-label="Registro migrazione" tabindex="0"></div>
        </main>
    </div>

    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Configurazione Supabase -->
    <script src="supabase-client.js"></script>

    <!-- Dati Locali -->
    <script src="data.js"></script>

    <!-- Script di Migrazione -->
    <script src="migrate.js"></script>
</body>

</html>
